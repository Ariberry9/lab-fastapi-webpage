{% extends "base.html" %}

{% block title %}Change password{% endblock %}

{% block content %}
    <h2>Change password</h2>
    <p class="muted">
        Enter your current password and choose a new one.
        New password must be at least 6 characters and different from
        your old one.
    </p>
    <form method="POST" action="{{ url_for('change_password') }}">
        <label for="old_password">Current password</label>
        <input id="old_password" name="old_password" type="password" autocomplete="current-password" required>

        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" required>

        <label for="new_password_confirm">Confirm new password</label>
        <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required>

        <button type="submit">Update password</button>
    </form>
    <p class="form-footer">
        <a href="{{ url_for('profile_edit') }}">Cancel</a>
    </p>
{% endblock %}
